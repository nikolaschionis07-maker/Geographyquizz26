  const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const genCode = () => Array.from({length:4}, () => CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join("");
  const genId = () => Math.random().toString(36).slice(2,10);
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch {} };
  const lsDel = k => { try { localStorage.removeItem(k); } catch {} };

  // ---------- answer matching (accepts close / misspelled answers) ----------
  const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim().replace(/^the /,"");
  function lev(a,b){
    const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
    let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
    for(let i=1;i<=m;i++){ cur[0]=i;
      for(let j=1;j<=n;j++){ const c=a[i-1]===b[j-1]?0:1; cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+c); }
      [prev,cur]=[cur,prev];
    }
    return prev[n];
  }
  function matches(input, acceptList){
    const x = norm(input); if(!x) return false;
    for(const raw of (acceptList||[])){
      const y = norm(raw); if(!y) continue;
      if(x===y) return true;
      const L = Math.max(x.length, y.length);
      const tol = L<=4 ? 1 : L<=8 ? 2 : 3;
      if(lev(x,y) <= tol) return true;
    }
    return false;
  }

  // ---------- question generation ----------
  function makeCountryQ(t, c){
    if(t==="capital") return { t:"capital", name:c.name, code:c.code, answer:c.capital, accept:[c.capital, ...(c.capAlt||[])], d:c.tier, fact:c.fact };
    return { t, code:c.code, answer:c.name, accept:[c.name, ...(c.alt||[])], d:c.tier, fact:c.fact };
  }
  function tiersFor(diff){ return diff==="easy" ? [1] : diff==="hard" ? [2,3] : [1,2]; }
  function buildSeq(n, diff){
    const tiers = tiersFor(diff);
    const countries = shuffle(COUNTRIES.filter(c => tiers.includes(c.tier)));
    const facts = shuffle(FACTS.filter(f => tiers.includes(f.d)));
    const nFacts = Math.min(facts.length, Math.max(1, Math.round(n * 0.22)));
    const nCountry = Math.min(countries.length, n - nFacts);
    const types = ["flag","map","capital"];
    const seq = [];
    countries.slice(0, nCountry).forEach(c => {
      let t = types[Math.floor(Math.random()*types.length)];
      if(t==="capital" && c.capAmbiguous) t = Math.random()<0.5 ? "flag" : "map";
      seq.push(makeCountryQ(t, c));
    });
    facts.slice(0, nFacts).forEach(f => seq.push({ t:"fact", q:f.q, answer:f.answer, accept:[f.answer, ...(f.alt||[])], d:f.d, fact:f.fact }));
    return shuffle(seq).slice(0, n);
  }

  // ---------- state ----------
  let me = { id: lsGet("geo_id") || genId(), name: lsGet("geo_name") || "" };
  lsSet("geo_id", me.id);
  let db = null;
  if (CONFIG_OK) { try { db = getDatabase(initializeApp(firebaseConfig)); } catch (e) { db = null; window.__err = (e && e.message) || String(e); } }

  let view="home", room=null, currentCode=null, unsub=null;
  let myAnswer=null, lastRound=-999, revealAttemptRound=-999, nextAttemptRound=-999, inQuestionKey=null;
  let settings = { rounds: 10 };
  let mapInstance = null;

  const rref = p => ref(db, "georooms/" + currentCode + (p ? "/" + p : ""));
  const setMsg = t => { const m = document.getElementById("msg"); if (m) m.textContent = t; };
  const lockedBox = txt => `<div class="locked">You answered: <b>${esc(txt)}</b></div>`;

  // ---------- map ----------
  function initMap(code){
    const host = document.getElementById("geomap"); if(!host) return;
    if(!window.jsVectorMap){ host.innerHTML = '<div class="maperr">Map couldn\'t load — check your connection.</div>'; return; }
    try { if(mapInstance) mapInstance.destroy(); } catch {}
    mapInstance = null;
    try {
      mapInstance = new window.jsVectorMap({
        selector:"#geomap", map:"world", zoomOnScroll:false, zoomButtons:false, backgroundColor:"transparent",
        regionStyle:{ initial:{ fill:"#6a79ad", stroke:"#141a38", strokeWidth:0.4 }, selected:{ fill:"#FFD23F" } },
        selectedRegions:[code]
      });
    } catch { host.innerHTML = '<div class="maperr">Map couldn\'t render.</div>'; }
  }
  window.addEventListener("resize", () => { try { if(mapInstance) mapInstance.updateSize(); } catch {} });

  // ---------- rendering ----------
  function render(){
    app_el.innerHTML = viewHTML();
    if(view==="room" && room && room.phase==="question"){
      const q = room.seq && room.seq[room.round];
      if(q && q.t==="map") initMap(q.code);
      updateTimerUI();
      const inp = document.getElementById("ansInput"); if(inp) setTimeout(()=>{ try{ inp.focus(); }catch{} }, 50);
    }
  }
  function viewHTML(){
    if(!CONFIG_OK) return setupHTML();
    if(!db) return errorHTML("Firebase couldn't start." + (window.__err ? " ("+esc(window.__err)+")" : ""));
    if(view==="home") return homeHTML();
    if(!room) return `<div class="wrap center"><div class="tag">Connecting…</div></div>`;
    if(room.phase==="lobby") return lobbyHTML();
    if(room.phase==="question") return questionHTML();
    if(room.phase==="reveal") return revealHTML();
    if(room.phase==="ended") return endedHTML();
    return "";
  }

  function setupHTML(){
    return `<div class="wrap"><h1 class="title" style="font-size:32px">Almost there</h1>
      <p class="tag">Add your Firebase database URL, then host this file.</p></div>`;
  }
  const errorHTML = t => `<div class="wrap"><h1 class="title" style="font-size:30px">Hmm</h1><p class="tag">${esc(t)}</p></div>`;

  function homeHTML(){
    return `<div class="wrap">
      <div class="spot" style="--g:var(--aqua)"><div class="emoji">🌍</div></div>
      <h1 class="title" style="margin-top:-6px">Geo Buzz</h1>
      <p class="tag">World geography, live — type your answer.</p>
      <div style="margin-top:24px">
        <input id="nameInput" class="field" maxlength="14" placeholder="Your name" value="${esc(me.name)}"/>
        <button class="cta coral" data-action="create">Create a game</button>
        <div class="or"><span></span><em>or join one</em><span></span></div>
        <div class="row">
          <input id="codeInput" class="field code" maxlength="4" placeholder="Room code"/>
          <button class="cta aqua sm" data-action="join">Join</button>
        </div>
        <div id="msg" class="msg"></div>
      </div>
    </div>`;
  }

  function lobbyHTML(){
    const players = Object.entries(room.players || {});
    const diff = room.difficulty || "medium";
    const pill = (v,cur,label,act) => `<button class="pill${cur===v?" on":""}" data-action="${act}" data-v="${v}">${label}</button>`;
    return `<div class="wrap center">
      <div class="muted">Room code</div>
      <div class="code-big">${esc(room.code || currentCode)}</div>
      <p class="tag">Share this code (or the page link) so friends can join.</p>
      <div class="card">
        <div class="muted" style="margin-bottom:8px">Players (${players.length})</div>
        <div class="chips">${players.map(([id,p]) => `<span class="chip${id===me.id?" me":""}">${esc(p.name)}${id===me.id?" (you)":""}</span>`).join("")}</div>
      </div>
      <div class="muted left" style="margin-top:16px">Difficulty</div>
      <div class="row3">${["easy","medium","hard"].map(v => pill(v, diff, v[0].toUpperCase()+v.slice(1), "difficulty")).join("")}</div>
      <div class="muted left" style="margin-top:12px">Questions</div>
      <div class="row3">${[5,10,15].map(v => pill(v, room.totalRounds, v, "rounds")).join("")}</div>
      <div class="muted" style="margin-top:12px">30 seconds per question</div>
      <button class="cta coral" data-action="start" ${players.length<2?"disabled":""}>${players.length<2?"Waiting for players…":"Start game"}</button>
      <button class="cta ghost" data-action="leave">Leave</button>
    </div>`;
  }

  function questionHTML(){
    const q = room.seq[room.round];
    const [ic,label] = TYPE_META[q.t] || ["🌍","Question"];
    const dmap = {1:["Easy","var(--green)"],2:["Medium","var(--yellow)"],3:["Hard","var(--coral)"]};
    const [dl,dc] = dmap[q.d] || dmap[2];
    const players = Object.keys(room.players || {}).length;
    const answered = Object.keys((room.answers && room.answers[room.round]) || {}).length;
    const locked = myAnswer != null;
    let visual = "", prompt = "";
    if(q.t==="flag"){ visual = `<div class="flagwrap"><img class="flag" src="https://flagcdn.com/w320/${q.code.toLowerCase()}.png" alt="National flag"/></div>`; prompt = "Which country's flag is this?"; }
    else if(q.t==="map"){ visual = `<div class="geomap" id="geomap"></div>`; prompt = "Which highlighted country is this?"; }
    else if(q.t==="capital"){ prompt = "What is the capital of " + esc(q.name) + "?"; }
    else { prompt = esc(q.q); }
    const area = locked
      ? lockedBox(myAnswer)
      : `<input id="ansInput" class="field ans" maxlength="40" placeholder="Type your answer" autocomplete="off" autocorrect="off" autocapitalize="words" enterkeyhint="send"/>
         <button class="cta coral" data-action="submit" style="margin-top:10px">Submit</button>`;
    return `<div class="wrap">
      <div class="qhead"><span class="muted">Question ${room.round+1} of ${room.totalRounds}</span>
        <span class="dpill" style="--dc:${dc}">${dl} · ${q.d} ${q.d===1?"pt":"pts"}</span></div>
      <div class="tbar"><div id="timerbar" class="tfill"></div></div><div id="timertext" class="ttext"></div>
      <div class="muted center" style="margin-bottom:8px">${ic} ${label}</div>
      ${visual}
      <div class="qcard"><div class="qtext">${prompt}</div></div>
      <div class="ansarea" id="answerArea" ${locked?'data-locked="1"':''}>${area}</div>
      <div class="muted center" id="answered" style="margin-top:14px">${locked?"Locked in — waiting for others":"Type and submit your answer"} · ${answered}/${players} in</div>
      <button class="cta ghost" data-action="leave">Leave</button>
    </div>`;
  }

  function refreshQuestionDynamic(){
    if(!room || room.phase!=="question") return;
    const players = Object.keys(room.players || {}).length;
    const answered = Object.keys((room.answers && room.answers[room.round]) || {}).length;
    const a = document.getElementById("answered");
    if(a) a.textContent = (myAnswer!=null ? "Locked in — waiting for others" : "Type and submit your answer") + " · " + answered + "/" + players + " in";
    if(myAnswer!=null){ const area = document.getElementById("answerArea"); if(area && !area.dataset.locked){ area.innerHTML = lockedBox(myAnswer); area.dataset.locked = "1"; } }
  }

  function revealHTML(){
    const q = room.seq[room.round];
    const mine = room.answers && room.answers[room.round] ? room.answers[room.round][me.id] : undefined;
    const gotIt = mine != null && matches(mine, q.accept);
    const status = gotIt ? "Correct!" : (mine == null ? "No answer" : "Not quite");
    const scolor = gotIt ? "var(--aqua)" : "var(--coral)";
    const flag = q.code ? `<div class="flagwrap sm"><img class="flag sm" src="https://flagcdn.com/w160/${q.code.toLowerCase()}.png" alt=""/></div>` : "";
    return `<div class="wrap center">
      <div class="status pop" style="color:${scolor}">${status}</div>
      ${flag}
      <div class="ans ok">✓ Answer: <b>${esc(q.answer)}</b></div>
      ${(mine != null && !gotIt) ? `<div class="ans no">✗ You wrote: <b>${esc(mine)}</b></div>` : ""}
      <div class="fact"><span style="color:var(--yellow)">💡</span> ${esc(q.fact)}</div>
      <div class="muted left" style="margin-top:16px">Scores</div>
      ${scoreboardHTML(false)}
      <button class="cta coral" data-action="next">${room.round+1 >= room.totalRounds ? "Finish" : "Next question"}</button>
      <button class="cta ghost" data-action="leave">Leave</button>
    </div>`;
  }

  function endedHTML(){
    const board = scoreArray();
    const top = board.length ? board[0].score : 0;
    const winners = board.filter(b => b.score === top).map(b => b.name);
    return `<div class="wrap center">
      <div class="emoji pop" style="font-size:40px">🏆</div>
      <div class="muted">${winners.length>1?"It's a tie!":"Winner"}</div>
      <div class="code-big" style="letter-spacing:normal">${winners.map(esc).join(" & ")}</div>
      ${scoreboardHTML(true)}
      <button class="cta coral" data-action="playagain">Play again</button>
      <button class="cta ghost" data-action="leave">Leave</button>
    </div>`;
  }

  function scoreFor(pid){
    if(!room || !room.seq) return 0;
    const through = (room.phase==="reveal" || room.phase==="ended") ? room.round : room.round - 1;
    let s = 0;
    for(let r=0; r<=through; r++){
      const q = room.seq[r]; if(!q) continue;
      const ans = room.answers && room.answers[r] ? room.answers[r][pid] : undefined;
      if(ans != null && matches(ans, q.accept)) s += q.d;
    }
    return s;
  }
  function scoreArray(){
    return Object.entries(room.players || {}).map(([id,p]) => ({ id, name: p.name, score: scoreFor(id) })).sort((a,b) => b.score - a.score);
  }
  function scoreboardHTML(medal){
    const arr = scoreArray(); const m = ["🥇","🥈","🥉"];
    return `<div class="board">${arr.map((p,i) => `<div class="brow${medal&&i===0?" top":""}"><span>${medal?(m[i]||(i+1)+".")+" ":""}${esc(p.name)}${p.id===me.id?" (you)":""}</span><b>${p.score}</b></div>`).join("")}</div>`;
  }

  // ---------- realtime ----------
  function applyRoom(){
    if(view==="room" && room && room.phase==="question"){
      const key = "" + room.round;
      if(key === inQuestionKey){ refreshQuestionDynamic(); return; }
      inQuestionKey = key; render(); return;
    }
    inQuestionKey = null; render();
  }
  function listen(code){
    if(unsub){ unsub(); unsub = null; }
    unsub = onValue(ref(db, "georooms/" + code), snap => {
      room = snap.val();
      if(room === null){
        if(unsub){ unsub(); unsub = null; }
        currentCode = null; lsDel("geo_code"); view = "home"; inQuestionKey = null; render(); setMsg("That game has ended.");
        return;
      }
      if(room.round !== lastRound){ lastRound = room.round; revealAttemptRound = -999; nextAttemptRound = -999; myAnswer = null; }
      if(room.phase==="question" && myAnswer==null && room.answers && room.answers[room.round] && room.answers[room.round][me.id] != null) myAnswer = room.answers[room.round][me.id];
      maybeAutoReveal();
      applyRoom();
    });
  }
  function updateTimerUI(){
    if(!room || room.phase!=="question" || !room.timerSecs) return;
    const remain = Math.max(0, room.timerSecs - Math.floor((Date.now() - room.qStartTs) / 1000));
    const bar = document.getElementById("timerbar"), txt = document.getElementById("timertext");
    if(bar){ bar.style.width = (remain / room.timerSecs * 100) + "%"; bar.style.background = remain <= 5 ? "var(--coral)" : "var(--aqua)"; }
    if(txt){ txt.textContent = remain + "s"; txt.style.color = remain <= 5 ? "var(--coral)" : "var(--lav)"; }
  }
  function maybeAutoReveal(){
    if(!db || !room || room.phase!=="question" || !currentCode || revealAttemptRound===room.round) return;
    const players = Object.keys(room.players || {}).length;
    const answered = Object.keys((room.answers && room.answers[room.round]) || {}).length;
    const timeUp = room.timerSecs > 0 && (Date.now() - room.qStartTs) >= room.timerSecs * 1000;
    if(players > 0 && (answered >= players || timeUp)){ revealAttemptRound = room.round; update(rref(), { phase:"reveal", revealTs:Date.now() }).catch(()=>{}); }
  }
  function maybeAutoNext(){
    if(!db || !room || room.phase!=="reveal" || !currentCode || nextAttemptRound===room.round) return;
    if(room.revealTs && (Date.now() - room.revealTs) >= AUTO_NEXT_MS){ nextAttemptRound = room.round; nextRound(); }
  }

  // ---------- actions ----------
  async function createRoom(){
    const name = (document.getElementById("nameInput").value || "").trim().slice(0,14);
    if(!name){ setMsg("Enter your name first."); return; }
    me.name = name; lsSet("geo_name", name);
    let code = genCode();
    try {
      for(let i=0;i<5;i++){ const s = await get(ref(db, "georooms/" + code)); if(!s.exists()) break; code = genCode(); }
      const r = { code, phase:"lobby", round:-1, totalRounds:settings.rounds, timerSecs:TIMER, difficulty:"medium", seq:null, qStartTs:0, revealTs:null, answers:null, players:{ [me.id]:{ name } }, createdAt:Date.now() };
      await set(ref(db, "georooms/" + code), r);
      currentCode = code; lsSet("geo_code", code); room = r;
    } catch (e){ setMsg("Could not reach Firebase: " + ((e && e.message) || e)); return; }
    view = "room"; inQuestionKey = null; render(); listen(code);
  }
  async function joinRoom(){
    const name = (document.getElementById("nameInput").value || "").trim().slice(0,14);
    const code = (document.getElementById("codeInput").value || "").trim().toUpperCase();
    if(!name){ setMsg("Enter your name first."); return; }
    if(!code){ setMsg("Enter a room code."); return; }
    me.name = name; lsSet("geo_name", name);
    let snap;
    try { snap = await get(ref(db, "georooms/" + code)); }
    catch (e){ setMsg("Could not reach Firebase: " + ((e && e.message) || e)); return; }
    if(!snap.exists()){ setMsg('No game found with code "' + code + '".'); return; }
    try { await set(ref(db, "georooms/" + code + "/players/" + me.id), { name }); }
    catch (e){ setMsg("Join failed: " + ((e && e.message) || e)); return; }
    currentCode = code; lsSet("geo_code", code);
    const doc = snap.val();
    room = doc.players && doc.players[me.id] ? doc : { ...doc, players: { ...(doc.players||{}), [me.id]: { name } } };
    view = "room"; inQuestionKey = null; render(); listen(code);
  }
  function startGame(){
    const req = room.totalRounds || 10;
    const seq = buildSeq(req, room.difficulty || "medium");
    update(rref(), { phase:"question", round:0, seq, totalRounds:seq.length, qStartTs:Date.now(), revealTs:null, answers:null }).catch(()=>{});
  }
  function nextRound(){
    const nr = room.round + 1;
    if(nr >= room.totalRounds) update(rref(), { phase:"ended" }).catch(()=>{});
    else update(rref(), { phase:"question", round:nr, qStartTs:Date.now(), revealTs:null }).catch(()=>{});
  }
  function playAgain(){
    const req = room.totalRounds || 10;
    const seq = buildSeq(req, room.difficulty || "medium");
    update(rref(), { phase:"question", round:0, seq, totalRounds:seq.length, qStartTs:Date.now(), revealTs:null, answers:null }).catch(()=>{});
  }
  function submitAnswer(){
    if(!room || room.phase!=="question" || myAnswer!=null) return;
    const inp = document.getElementById("ansInput"); if(!inp) return;
    const text = (inp.value || "").trim(); if(!text) return;
    myAnswer = text;
    const area = document.getElementById("answerArea"); if(area){ area.innerHTML = lockedBox(text); area.dataset.locked = "1"; }
    refreshQuestionDynamic();
    set(ref(db, "georooms/" + currentCode + "/answers/" + room.round + "/" + me.id), text).catch(()=>{});
  }
  function setRounds(v){ if(room && room.phase==="lobby") update(rref(), { totalRounds: v }).catch(()=>{}); }
  function setDifficulty(v){ if(room && room.phase==="lobby") update(rref(), { difficulty: v }).catch(()=>{}); }
  function leave(){
    try { if(currentCode) remove(ref(db, "georooms/" + currentCode + "/players/" + me.id)); } catch {}
    if(unsub){ unsub(); unsub = null; }
    try { if(mapInstance) mapInstance.destroy(); } catch {}
    mapInstance = null; currentCode = null; room = null; myAnswer = null; lastRound = -999; inQuestionKey = null;
    lsDel("geo_code"); view = "home"; render();
  }

  app_el.addEventListener("click", ev => {
    const t = ev.target.closest("[data-action]"); if(!t) return;
    const a = t.getAttribute("data-action");
    if(a==="create") createRoom();
    else if(a==="join") joinRoom();
    else if(a==="start") startGame();
    else if(a==="submit") submitAnswer();
    else if(a==="next") nextRound();
    else if(a==="playagain") playAgain();
    else if(a==="leave") leave();
    else if(a==="rounds") setRounds(parseInt(t.getAttribute("data-v"),10));
    else if(a==="difficulty") setDifficulty(t.getAttribute("data-v"));
  });
  app_el.addEventListener("keydown", ev => { if(ev.key==="Enter"){ const t = ev.target; if(t && t.id==="ansInput"){ ev.preventDefault(); submitAnswer(); } } });

  (async function init(){
    render();
    if(CONFIG_OK && db){
      const saved = lsGet("geo_code");
      if(saved){
        try { const s = await get(ref(db, "georooms/" + saved)); if(s.exists()){ currentCode = saved; room = s.val(); view = "room"; listen(saved); } else lsDel("geo_code"); } catch {}
        applyRoom();
      }
      setInterval(() => { updateTimerUI(); maybeAutoReveal(); maybeAutoNext(); }, 1000);
    }
  })();
</script>
</body>
</html>
