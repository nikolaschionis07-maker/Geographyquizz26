<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Geo Buzz — Live Geography Game</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/jsvectormap.min.css" />
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/jsvectormap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/maps/world.js"></script>
<style>
  :root{ --coral:#FF6B5C; --aqua:#3DE0C0; --yellow:#FFD23F; --green:#57D98E; --white:#FBF7FF; --lav:#B9A9D9; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ min-height:100vh; color:var(--white);
    font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, #1f3a63 0%, #1b2c54 45%, #141a38 100%);
    display:flex; align-items:center; justify-content:center; padding:32px 20px; }
  .wrap{ width:100%; max-width:460px; }
  .center{ text-align:center; } .left{ text-align:left; }
  .muted{ color:var(--lav); font-size:14px; }
  .tag{ color:var(--lav); text-align:center; font-size:17px; margin:8px 0 0; }
  .title{ font-size:52px; font-weight:900; letter-spacing:-1px; text-align:center; margin:0; }
  .emoji{ font-size:42px; }
  .spot{ position:relative; display:flex; align-items:center; justify-content:center; min-height:120px; }
  .spot::before{ content:""; position:absolute; width:210px; height:210px; border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--g) 36%, transparent) 0%, transparent 70%);
    animation:glow 3.2s ease-in-out infinite; }
  .field{ width:100%; padding:14px 16px; font-size:18px; border-radius:16px; color:var(--white);
    background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16); outline:none; }
  .field.code{ text-align:center; letter-spacing:.3em; font-weight:800; text-transform:uppercase; }
  .cta{ width:100%; padding:16px 20px; border-radius:18px; border:none; font-weight:800; font-size:18px;
    cursor:pointer; margin-top:16px; transition:transform .08s ease, filter .15s ease; color:#07243f; }
  .cta:active{ transform:scale(.98); } .cta:hover{ filter:brightness(1.05); } .cta:disabled{ opacity:.45; cursor:default; }
  .cta.coral{ background:var(--coral); color:#2A0E0A; }
  .cta.aqua{ background:var(--aqua); color:#06342B; }
  .cta.ghost{ background:transparent; border:1px solid rgba(255,255,255,.25); color:var(--white); }
  .cta.sm{ width:auto; margin-top:0; padding:14px 22px; }
  .row{ display:flex; gap:8px; } .row3{ display:flex; gap:8px; }
  .or{ display:flex; align-items:center; gap:12px; color:var(--lav); margin:20px 0; }
  .or span{ flex:1; height:1px; background:rgba(255,255,255,.15); } .or em{ font-style:normal; font-size:14px; }
  .msg{ color:var(--coral); font-size:14px; margin-top:10px; min-height:18px; }
  .card{ background:rgba(255,255,255,.06); border-radius:18px; padding:16px; margin-top:20px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .chip{ padding:6px 12px; border-radius:999px; font-weight:600; font-size:15px;
    background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.14); }
  .chip.me{ background:color-mix(in srgb, var(--yellow) 18%, transparent); border-color:color-mix(in srgb, var(--yellow) 55%, transparent); }
  .code-big{ font-size:60px; font-weight:900; letter-spacing:.2em; color:var(--yellow); margin:6px 0; }
  .pill{ flex:1; padding:12px 0; border-radius:16px; font-size:18px; font-weight:700; cursor:pointer;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16); color:var(--white); }
  .pill.on{ background:var(--coral); color:#2A0E0A; border-color:transparent; }
  .qhead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .dpill{ padding:5px 12px; border-radius:999px; font-size:14px; font-weight:700;
    color:var(--dc); background:color-mix(in srgb, var(--dc) 14%, transparent); border:1px solid color-mix(in srgb, var(--dc) 45%, transparent); }
  .tbar{ width:100%; height:8px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden; }
  .tfill{ height:8px; border-radius:999px; background:var(--aqua); width:100%; transition:width 1s linear; }
  .ttext{ text-align:center; font-size:14px; color:var(--lav); margin-top:4px; margin-bottom:8px; }
  .geomap{ width:100%; height:300px; border-radius:18px; overflow:hidden; margin-bottom:16px;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); }
  .maperr{ padding:36px 12px; text-align:center; color:var(--lav); font-size:14px; }
  .flagwrap{ display:flex; justify-content:center; margin-bottom:16px; }
  .flagwrap.sm{ margin:10px 0; }
  .flag{ width:100%; max-width:280px; border-radius:12px; border:1px solid rgba(255,255,255,.18); box-shadow:0 6px 20px rgba(0,0,0,.35); display:block; }
  .flag.sm{ max-width:120px; }
  .qcard{ background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:22px; padding:18px 20px; text-align:center; margin-bottom:16px; }
  .qtext{ font-size:23px; font-weight:800; line-height:1.2; }
  .opts{ display:flex; flex-direction:column; gap:12px; }
  .opt{ width:100%; text-align:left; padding:16px 18px; border-radius:16px; font-size:17px; font-weight:600; cursor:pointer;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); color:var(--white);
    transition:transform .08s ease, background .15s ease, border-color .15s ease; }
  .opt:hover:not(:disabled){ background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.3); }
  .opt:active:not(:disabled){ transform:scale(.98); } .opt:disabled{ cursor:default; opacity:.55; }
  .opt.picked{ background:color-mix(in srgb, var(--aqua) 18%, transparent); border-color:color-mix(in srgb, var(--aqua) 60%, transparent); opacity:1; }
  .status{ font-size:30px; font-weight:900; }
  .ans{ text-align:left; padding:12px 16px; border-radius:16px; margin-top:12px; }
  .ans.ok{ background:color-mix(in srgb, var(--green) 12%, transparent); border:1px solid color-mix(in srgb, var(--green) 40%, transparent); }
  .ans.no{ background:color-mix(in srgb, var(--coral) 12%, transparent); border:1px solid color-mix(in srgb, var(--coral) 40%, transparent); }
  .fact{ text-align:left; background:rgba(255,255,255,.06); border-radius:16px; padding:14px 16px; margin-top:12px; font-size:15px; }
  .board{ display:flex; flex-direction:column; gap:8px; }
  .brow{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-radius:16px;
    background:rgba(255,255,255,.06); border:1px solid transparent; font-weight:600; }
  .brow.top{ background:color-mix(in srgb, var(--yellow) 16%, transparent); border-color:color-mix(in srgb, var(--yellow) 45%, transparent); }
  .brow b{ font-weight:900; }
  .steps b{ color:var(--white); } a{ color:var(--aqua); }
  @keyframes glow{ 0%,100%{opacity:.5} 50%{opacity:.9} }
  @keyframes pop{ 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.08)} 100%{transform:scale(1);opacity:1} }
  .pop{ animation:pop .45s ease-out both; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  .jvm-container{ background:transparent !important; }
</style>
</head>
<body>
<div id="app">
  <div class="wrap center">
    <div class="title" style="font-size:34px">Loading…</div>
    <p class="tag">If this stays, you're likely viewing the file inside Claude's preview (expected — download and host it), or your device blocked the scripts.</p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getDatabase, ref, get, set, update, onValue, remove } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  /* ============================================================
     PASTE YOUR NEW FIREBASE DATABASE URL BELOW
     (Firebase console → Realtime Database → copy the URL at the top,
      or Project settings → Your apps → Web → firebaseConfig.databaseURL)
     ============================================================ */
  const firebaseConfig = {
    databaseURL: "https://buzz-a5632-default-rtdb.europe-west1.firebasedatabase.app/",
    projectId: "buzz-a5632"
  };
  /* ============================================================ */

  const CONFIG_OK = !!(firebaseConfig.databaseURL && !firebaseConfig.databaseURL.includes("PASTE"));

  // ---------- Countries (name, ISO-2 code, capital, continent, tier=points, fun fact) ----------
  const COUNTRIES = [
    {name:"France",code:"FR",capital:"Paris",continent:"Europe",tier:1,fact:"France is the most visited country in the world."},
    {name:"Germany",code:"DE",capital:"Berlin",continent:"Europe",tier:1,fact:"Germany has over 1,500 kinds of beer."},
    {name:"Italy",code:"IT",capital:"Rome",continent:"Europe",tier:1,fact:"Italy has the most UNESCO World Heritage Sites."},
    {name:"Spain",code:"ES",capital:"Madrid",continent:"Europe",tier:1,fact:"Madrid sits almost exactly in the geographic center of Spain."},
    {name:"United Kingdom",code:"GB",capital:"London",continent:"Europe",tier:1,fact:"The UK has no single written constitution."},
    {name:"Greece",code:"GR",capital:"Athens",continent:"Europe",tier:1,fact:"Greece has around 6,000 islands, but only ~230 are inhabited."},
    {name:"Portugal",code:"PT",capital:"Lisbon",continent:"Europe",tier:2,fact:"Lisbon is older than Rome by roughly four centuries."},
    {name:"Netherlands",code:"NL",capital:"Amsterdam",continent:"Europe",tier:2,fact:"The Netherlands has more bicycles than people."},
    {name:"Switzerland",code:"CH",capital:"Bern",continent:"Europe",tier:2,fact:"The capital is Bern, not Zurich or Geneva."},
    {name:"Sweden",code:"SE",capital:"Stockholm",continent:"Europe",tier:2,fact:"Sweden has over 260,000 islands — the most of any country."},
    {name:"Norway",code:"NO",capital:"Oslo",continent:"Europe",tier:2,fact:"Norway introduced salmon sushi to Japan in the 1980s."},
    {name:"Poland",code:"PL",capital:"Warsaw",continent:"Europe",tier:2,fact:"Marie Curie, born in Warsaw, won Nobel Prizes in two sciences."},
    {name:"Ireland",code:"IE",capital:"Dublin",continent:"Europe",tier:2,fact:"Ireland is nicknamed the Emerald Isle for its greenery."},
    {name:"Austria",code:"AT",capital:"Vienna",continent:"Europe",tier:2,fact:"Vienna is regularly ranked the world's most livable city."},
    {name:"Iceland",code:"IS",capital:"Reykjavik",continent:"Europe",tier:3,fact:"Iceland has no mosquitoes."},
    {name:"Croatia",code:"HR",capital:"Zagreb",continent:"Europe",tier:3,fact:"The necktie originated in Croatia."},
    {name:"Japan",code:"JP",capital:"Tokyo",continent:"Asia",tier:1,fact:"Japan has more than 5 million vending machines."},
    {name:"China",code:"CN",capital:"Beijing",continent:"Asia",tier:1,fact:"China spans five geographic time zones but uses only one."},
    {name:"India",code:"IN",capital:"New Delhi",continent:"Asia",tier:1,fact:"India is the world's most populous country."},
    {name:"South Korea",code:"KR",capital:"Seoul",continent:"Asia",tier:2,fact:"South Korea has some of the fastest internet on Earth."},
    {name:"Thailand",code:"TH",capital:"Bangkok",continent:"Asia",tier:2,fact:"Bangkok's full ceremonial name is the longest city name in the world."},
    {name:"Vietnam",code:"VN",capital:"Hanoi",continent:"Asia",tier:2,fact:"Vietnam is the world's second-largest coffee exporter."},
    {name:"Indonesia",code:"ID",capital:"Jakarta",continent:"Asia",tier:2,fact:"Indonesia is made up of more than 17,000 islands."},
    {name:"Turkey",code:"TR",capital:"Ankara",continent:"Asia",tier:2,fact:"Istanbul spans two continents, but the capital is Ankara."},
    {name:"Saudi Arabia",code:"SA",capital:"Riyadh",continent:"Asia",tier:2,fact:"Saudi Arabia has no permanent rivers."},
    {name:"United Arab Emirates",code:"AE",capital:"Abu Dhabi",continent:"Asia",tier:2,fact:"The capital is Abu Dhabi, not Dubai."},
    {name:"Israel",code:"IL",capital:"Jerusalem",continent:"Asia",tier:3,fact:"The nearby Dead Sea is the lowest point on dry land."},
    {name:"Nepal",code:"NP",capital:"Kathmandu",continent:"Asia",tier:3,fact:"Nepal's flag is the only national flag that isn't a rectangle."},
    {name:"Philippines",code:"PH",capital:"Manila",continent:"Asia",tier:3,fact:"The Philippines is made up of over 7,600 islands."},
    {name:"Egypt",code:"EG",capital:"Cairo",continent:"Africa",tier:1,fact:"Cairo is the largest city in Africa and the Arab world."},
    {name:"South Africa",code:"ZA",capital:"Pretoria",continent:"Africa",tier:2,capAmbiguous:true,fact:"South Africa has three capitals; Pretoria is the executive one."},
    {name:"Nigeria",code:"NG",capital:"Abuja",continent:"Africa",tier:2,fact:"Nigeria is Africa's most populous country; its capital is Abuja, not Lagos."},
    {name:"Kenya",code:"KE",capital:"Nairobi",continent:"Africa",tier:2,fact:"Kenya is home to the Great Rift Valley."},
    {name:"Morocco",code:"MA",capital:"Rabat",continent:"Africa",tier:2,fact:"The capital is Rabat, though Casablanca is bigger."},
    {name:"Ethiopia",code:"ET",capital:"Addis Ababa",continent:"Africa",tier:3,fact:"Ethiopia follows its own calendar, about 7–8 years behind."},
    {name:"Tanzania",code:"TZ",capital:"Dodoma",continent:"Africa",tier:3,fact:"Mount Kilimanjaro, Africa's highest peak, is in Tanzania."},
    {name:"Ghana",code:"GH",capital:"Accra",continent:"Africa",tier:3,fact:"Ghana was the first sub-Saharan country to win independence."},
    {name:"United States",code:"US",capital:"Washington",continent:"North America",tier:1,fact:"The US has no official language at the federal level."},
    {name:"Canada",code:"CA",capital:"Ottawa",continent:"North America",tier:1,fact:"Canada has the longest coastline of any country; its capital is Ottawa."},
    {name:"Mexico",code:"MX",capital:"Mexico City",continent:"North America",tier:1,fact:"Mexico City sinks several centimeters every year."},
    {name:"Cuba",code:"CU",capital:"Havana",continent:"North America",tier:2,fact:"Cuba is the largest island in the Caribbean."},
    {name:"Jamaica",code:"JM",capital:"Kingston",continent:"North America",tier:3,fact:"Jamaica has produced some of the fastest sprinters in history."},
    {name:"Costa Rica",code:"CR",capital:"San Jose",continent:"North America",tier:3,fact:"Costa Rica abolished its army in 1948."},
    {name:"Brazil",code:"BR",capital:"Brasilia",continent:"South America",tier:1,fact:"Brasília was purpose-built and opened in 1960; it isn't Rio."},
    {name:"Argentina",code:"AR",capital:"Buenos Aires",continent:"South America",tier:1,fact:"Argentina has the world's southernmost city."},
    {name:"Chile",code:"CL",capital:"Santiago",continent:"South America",tier:2,fact:"Chile is over 4,300 km long but averages only ~180 km wide."},
    {name:"Peru",code:"PE",capital:"Lima",continent:"South America",tier:2,fact:"Peru is home to Machu Picchu."},
    {name:"Colombia",code:"CO",capital:"Bogota",continent:"South America",tier:2,fact:"Colombia touches both the Pacific and the Caribbean."},
    {name:"Bolivia",code:"BO",capital:"La Paz",continent:"South America",tier:3,capAmbiguous:true,fact:"Bolivia has two capitals: Sucre (constitutional) and La Paz (seat of government)."},
    {name:"Australia",code:"AU",capital:"Canberra",continent:"Oceania",tier:1,fact:"The capital is Canberra, not Sydney."},
    {name:"New Zealand",code:"NZ",capital:"Wellington",continent:"Oceania",tier:2,fact:"New Zealand was the first country to give women the vote."},
    {name:"Fiji",code:"FJ",capital:"Suva",continent:"Oceania",tier:3,fact:"Fiji is made up of more than 300 islands."}
  ];

  // ---------- Stand-alone fun-fact questions ----------
  const FACTS = [
    {q:"Which country is the largest by land area?",opts:["Canada","China","USA","Russia"],correct:3,d:1,fact:"Russia spans 11 time zones."},
    {q:"Which continent has the most countries?",opts:["Asia","Africa","Europe","South America"],correct:1,d:2,fact:"Africa has 54 recognized countries."},
    {q:"Which country has the most lakes?",opts:["USA","Russia","Canada","Finland"],correct:2,d:2,fact:"Canada has more lake area than the rest of the world combined."},
    {q:"Which is the smallest country in the world?",opts:["Monaco","Nauru","Vatican City","San Marino"],correct:2,d:2,fact:"Vatican City is only about 0.49 km²."},
    {q:"Which is the world's largest hot desert?",opts:["Gobi","Sahara","Kalahari","Arabian"],correct:1,d:2,fact:"Antarctica is the largest desert overall; the Sahara is the largest hot desert."},
    {q:"Which country has the most people?",opts:["China","India","USA","Indonesia"],correct:1,d:1,fact:"India recently overtook China as the most populous country."},
    {q:"The equator runs through which country?",opts:["Ecuador","Peru","Bolivia","Chile"],correct:0,d:2,fact:"Ecuador is literally named after the equator."},
    {q:"Which country has the longest coastline?",opts:["Russia","Canada","Indonesia","Australia"],correct:1,d:3,fact:"Canada's coastline is by far the world's longest."},
    {q:"Istanbul is a city that sits on two…",opts:["Rivers","Continents","Countries","Islands"],correct:1,d:2,fact:"Istanbul straddles Europe and Asia across the Bosphorus."},
    {q:"Which African country largely avoided European colonization?",opts:["Kenya","Ethiopia","Ghana","Nigeria"],correct:1,d:3,fact:"Ethiopia resisted colonization, apart from a brief Italian occupation."},
    {q:"The deepest point in any ocean lies in the…",opts:["Atlantic","Indian","Pacific","Arctic"],correct:2,d:2,fact:"The Mariana Trench in the Pacific is nearly 11 km deep."},
    {q:"Which country has the only non-rectangular national flag?",opts:["Nepal","Bhutan","Qatar","Sri Lanka"],correct:0,d:3,fact:"Nepal's flag is two stacked triangular pennants."},
    {q:"Including overseas territories, which country spans the most time zones?",opts:["Russia","USA","France","UK"],correct:2,d:3,fact:"Counting its overseas territories, France spans 12 time zones."}
  ];

  const TYPE_META = { flag:["🚩","Flag"], map:["🗺️","Find the country"], capital:["🏛️","Capital"], fact:["🌍","Fun fact"] };

  // ---------- utils ----------
  const app_el = document.getElementById("app");
  const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const genCode = () => Array.from({length:4}, () => CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join("");
  const genId = () => Math.random().toString(36).slice(2,10);
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch {} };
  const lsDel = k => { try { localStorage.removeItem(k); } catch {} };

  // ---------- question generation ----------
  function pickDistractors(c, all, n){
    let pool = shuffle(all.filter(x => x.continent===c.continent && x.code!==c.code));
    if (pool.length < n) pool = pool.concat(shuffle(all.filter(x => x.continent!==c.continent && x.code!==c.code)));
    return pool.slice(0, n);
  }
  function makeCountryQ(t, c, all){
    if (t === "capital"){
      const opts = shuffle([c.capital, ...pickDistractors(c, all, 3).map(x => x.capital)]);
      return { t:"capital", name:c.name, code:c.code, opts, correct:opts.indexOf(c.capital), d:c.tier, fact:c.fact };
    }
    const opts = shuffle([c.name, ...pickDistractors(c, all, 3).map(x => x.name)]);
    return { t, code:c.code, opts, correct:opts.indexOf(c.name), d:c.tier, fact:c.fact };
  }
  function buildSeq(n){
    const countries = shuffle(COUNTRIES);
    const facts = shuffle(FACTS);
    const nFacts = Math.min(facts.length, Math.max(1, Math.round(n * 0.22)));
    const nCountry = n - nFacts;
    const types = ["flag","map","capital"];
    const seq = [];
    countries.slice(0, nCountry).forEach(c => {
      let t = types[Math.floor(Math.random()*types.length)];
      if (t === "capital" && c.capAmbiguous) t = Math.random() < 0.5 ? "flag" : "map";
      seq.push(makeCountryQ(t, c, COUNTRIES));
    });
    facts.slice(0, nFacts).forEach(f => seq.push({ t:"fact", q:f.q, opts:f.opts, correct:f.correct, d:f.d, fact:f.fact }));
    return shuffle(seq).slice(0, n);
  }

  // ---------- state ----------
  let me = { id: lsGet("geo_id") || genId(), name: lsGet("geo_name") || "" };
  lsSet("geo_id", me.id);
  let db = null;
  if (CONFIG_OK) { try { db = getDatabase(initializeApp(firebaseConfig)); } catch (e) { db = null; window.__err = (e && e.message) || String(e); } }

  let view = "home", room = null, currentCode = null, unsub = null;
  let myPick = null, lastRoundKey = null, revealAttemptRound = -99, inQuestionKey = null;
  let settings = { rounds: 10, timer: 30 };
  let mapInstance = null;

  const rref = p => ref(db, "georooms/" + currentCode + (p ? "/" + p : ""));
  const setMsg = t => { const m = document.getElementById("msg"); if (m) m.textContent = t; };

  // ---------- map ----------
  function initMap(code){
    const host = document.getElementById("geomap"); if (!host) return;
    if (!window.jsVectorMap){ host.innerHTML = '<div class="maperr">Map couldn\'t load — check your connection.</div>'; return; }
    try { if (mapInstance) mapInstance.destroy(); } catch {}
    mapInstance = null;
    try {
      mapInstance = new window.jsVectorMap({
        selector: "#geomap", map: "world", zoomOnScroll: false, zoomButtons: false, backgroundColor: "transparent",
        regionStyle: { initial: { fill: "#6a79ad", stroke: "#141a38", strokeWidth: 0.4 }, selected: { fill: "#FFD23F" } },
        selectedRegions: [code]
      });
    } catch { host.innerHTML = '<div class="maperr">Map couldn\'t render.</div>'; }
  }
  window.addEventListener("resize", () => { try { if (mapInstance) mapInstance.updateSize(); } catch {} });

  // ---------- rendering ----------
  function render(){
    app_el.innerHTML = viewHTML();
    if (view === "room" && room && room.phase === "question"){
      const q = room.seq && room.seq[room.round];
      if (q && q.t === "map") initMap(q.code);
      updateTimerUI();
    }
  }
  function viewHTML(){
    if (!CONFIG_OK) return setupHTML();
    if (!db) return errorHTML("Firebase couldn't start." + (window.__err ? " (" + esc(window.__err) + ")" : ""));
    if (view === "home") return homeHTML();
    if (!room) return `<div class="wrap center"><div class="tag">Connecting…</div></div>`;
    if (room.phase === "lobby") return lobbyHTML();
    if (room.phase === "question") return questionHTML();
    if (room.phase === "reveal") return revealHTML();
    if (room.phase === "ended") return endedHTML();
    return "";
  }

  function setupHTML(){
    return `<div class="wrap">
      <h1 class="title" style="font-size:32px">Almost there</h1>
      <p class="tag">Geo Buzz needs a free Firebase backend. Add its database URL to this file, then host the file.</p>
      <div class="card left steps" style="line-height:1.7">
        <b>1.</b> Create a project at console.firebase.google.com<br/>
        <b>2.</b> Build → Realtime Database → Create database → start in <b>test mode</b><br/>
        <b>3.</b> Copy the database URL shown at the top of that page<br/>
        <b>4.</b> Paste it in this file where it says <b>PASTE_databaseURL</b><br/>
        <b>5.</b> Host this file and open the link on each phone
      </div>
      <p class="tag" style="margin-top:12px">Seeing this inside Claude's preview? That's expected — download and host it.</p>
    </div>`;
  }
  const errorHTML = t => `<div class="wrap"><h1 class="title" style="font-size:30px">Hmm</h1><p class="tag">${esc(t)}</p></div>`;

  function homeHTML(){
    return `<div class="wrap">
      <div class="spot" style="--g:var(--aqua)"><div class="emoji">🌍</div></div>
      <h1 class="title" style="margin-top:-6px">Geo Buzz</h1>
      <p class="tag">World geography, live — on every phone.</p>
      <div style="margin-top:24px">
        <input id="nameInput" class="field" maxlength="14" placeholder="Your name" value="${esc(me.name)}"/>
        <button class="cta coral" data-action="create">Create a game</button>
        <div class="or"><span></span><em>or join one</em><span></span></div>
        <div class="row">
          <input id="codeInput" class="field code" maxlength="4" placeholder="Room code"/>
          <button class="cta aqua sm" data-action="join">Join</button>
        </div>
        <div id="msg" class="msg"></div>
      </div>
    </div>`;
  }

  function lobbyHTML(){
    const players = Object.entries(room.players || {});
    const opt = (v,cur,label,act) => `<button class="pill${cur===v?" on":""}" data-action="${act}" data-v="${v}">${label}</button>`;
    return `<div class="wrap center">
      <div class="muted">Room code</div>
      <div class="code-big">${esc(room.code || currentCode)}</div>
      <p class="tag">Share this code (or the page link) so friends can join.</p>
      <div class="card">
        <div class="muted" style="margin-bottom:8px">Players (${players.length})</div>
        <div class="chips">${players.map(([id,p]) => `<span class="chip${id===me.id?" me":""}">${esc(p.name)}${id===me.id?" (you)":""}</span>`).join("")}</div>
      </div>
      <div class="muted left" style="margin-top:16px">Questions</div>
      <div class="row3">${[5,10,15].map(v => opt(v, room.totalRounds, v, "rounds")).join("")}</div>
      <div class="muted left" style="margin-top:12px">Timer per question</div>
      <div class="row3">${[15,30,0].map(v => opt(v, room.timerSecs, v===0?"Off":v+"s", "timer")).join("")}</div>
      <button class="cta coral" data-action="start" ${players.length<2?"disabled":""}>${players.length<2?"Waiting for players…":"Start game"}</button>
      <button class="cta ghost" data-action="leave">Leave</button>
    </div>`;
  }

  function questionHTML(){
    const q = room.seq[room.round];
    const [ic,label] = TYPE_META[q.t] || ["🌍","Question"];
    const dmap = {1:["Easy","var(--green)"],2:["Medium","var(--yellow)"],3:["Hard","var(--coral)"]};
    const [dl,dc] = dmap[q.d] || dmap[2];
    const players = Object.keys(room.players || {}).length;
    const answered = Object.keys((room.answers && room.answers[room.round]) || {}).length;
    const locked = myPick != null;
    const timer = room.timerSecs > 0 ? `<div class="tbar"><div id="timerbar" class="tfill"></div></div><div id="timertext" class="ttext"></div>` : "";
    let visual = "", prompt = "";
    if (q.t === "flag"){ visual = `<div class="flagwrap"><img class="flag" src="https://flagcdn.com/w320/${q.code.toLowerCase()}.png" alt="National flag"/></div>`; prompt = "Which country's flag is this?"; }
    else if (q.t === "map"){ visual = `<div class="geomap" id="geomap"></div>`; prompt = "Which highlighted country is this?"; }
    else if (q.t === "capital"){ prompt = "What is the capital of " + esc(q.name) + "?"; }
    else { prompt = esc(q.q); }
    return `<div class="wrap">
      <div class="qhead"><span class="muted">Question ${room.round+1} of ${room.totalRounds}</span>
        <span class="dpill" style="--dc:${dc}">${dl} · ${q.d} ${q.d===1?"pt":"pts"}</span></div>
      ${timer}
      <div class="muted center" style="margin-bottom:8px">${ic} ${label}</div>
      ${visual}
      <div class="qcard"><div class="qtext">${prompt}</div></div>
      <div class="opts" id="opts">${q.opts.map((o,i) => `<button class="opt${myPick===i?" picked":""}" data-action="answer" data-i="${i}" ${locked?"disabled":""}>${esc(o)}</button>`).join("")}</div>
      <div class="muted center" id="answered" style="margin-top:14px">${locked?"Locked in — waiting for others":"Tap your answer"} · ${answered}/${players} in</div>
      <button class="cta aqua" data-action="reveal">Reveal answers</button>
      <button class="cta ghost" data-action="leave">Leave</button>
    </div>`;
  }

  function refreshQuestionDynamic(){
    if (!room || room.phase !== "question") return;
    const players = Object.keys(room.players || {}).length;
    const answered = Object.keys((room.answers && room.answers[room.round]) || {}).length;
    const locked = myPick != null;
    const a = document.getElementById("answered");
    if (a) a.textContent = (locked ? "Locked in — waiting for others" : "Tap your answer") + " · " + answered + "/" + players + " in";
    document.querySelectorAll("#opts .opt").forEach(btn => {
      const i = parseInt(btn.getAttribute("data-i"), 10);
      btn.disabled = locked;
      btn.classList.toggle("picked", myPick === i);
    });
  }

  function revealHTML(){
    const q = room.seq[room.round];
    const mine = room.answers && room.answers[room.round] ? room.answers[room.round][me.id] : undefined;
    const gotIt = mine === q.correct;
    const status = gotIt ? "You got it!" : (mine == null ? "No answer" : "Not quite");
    const scolor = gotIt ? "var(--aqua)" : "var(--coral)";
    const flag = q.code ? `<div class="flagwrap sm"><img class="flag sm" src="https://flagcdn.com/w160/${q.code.toLowerCase()}.png" alt=""/></div>` : "";
    return `<div class="wrap center">
      <div class="status pop" style="color:${scolor}">${status}</div>
      ${flag}
      <div class="ans ok">✓ Answer: <b>${esc(q.opts[q.correct])}</b></div>
      ${(!gotIt && mine != null) ? `<div class="ans no">✗ You picked: <b>${esc(q.opts[mine])}</b></div>` : ""}
      <div class="fact"><span style="color:var(--yellow)">💡</span> ${esc(q.fact)}</div>
      <div class="muted left" style="margin-top:16px">Scores</div>
      ${scoreboardHTML(false)}
      <button class="cta coral" data-action="next">${room.round+1 >= room.totalRounds ? "Finish" : "Next question"}</button>
      <button class="cta ghost" data-action="leave">Leave</button>
    </div>`;
  }

  function endedHTML(){
    const board = scoreArray();
    const top = board.length ? board[0].score : 0;
    const winners = board.filter(b => b.score === top).map(b => b.name);
    return `<div class="wrap center">
      <div class="emoji pop" style="font-size:40px">🏆</div>
      <div class="muted">${winners.length>1?"It's a tie!":"Winner"}</div>
      <div class="code-big" style="letter-spacing:normal">${winners.map(esc).join(" & ")}</div>
      ${scoreboardHTML(true)}
      <button class="cta coral" data-action="playagain">Play again</button>
      <button class="cta ghost" data-action="leave">Leave</button>
    </div>`;
  }

  function scoreFor(pid){
    if (!room || !room.seq) return 0;
    const through = (room.phase === "reveal" || room.phase === "ended") ? room.round : room.round - 1;
    let s = 0;
    for (let r = 0; r <= through; r++){
      const q = room.seq[r]; if (!q) continue;
      const ans = room.answers && room.answers[r] ? room.answers[r][pid] : undefined;
      if (ans === q.correct) s += q.d;
    }
    return s;
  }
  function scoreArray(){
    return Object.entries(room.players || {}).map(([id,p]) => ({ id, name: p.name, score: scoreFor(id) })).sort((a,b) => b.score - a.score);
  }
  function scoreboardHTML(medal){
    const arr = scoreArray(); const m = ["🥇","🥈","🥉"];
    return `<div class="board">${arr.map((p,i) => `<div class="brow${medal&&i===0?" top":""}"><span>${medal?(m[i]||(i+1)+".")+" ":""}${esc(p.name)}${p.id===me.id?" (you)":""}</span><b>${p.score}</b></div>`).join("")}</div>`;
  }

  // ---------- realtime ----------
  function applyRoom(){
    if (view === "room" && room && room.phase === "question"){
      const key = "" + room.round;
      if (key === inQuestionKey){ refreshQuestionDynamic(); return; }
      inQuestionKey = key; render(); return;
    }
    inQuestionKey = null; render();
  }
  function listen(code){
    if (unsub) { unsub(); unsub = null; }
    unsub = onValue(ref(db, "georooms/" + code), snap => {
      room = snap.val();
      if (room === null){
        if (unsub) { unsub(); unsub = null; }
        currentCode = null; lsDel("geo_code"); view = "home"; inQuestionKey = null; render(); setMsg("That game has ended.");
        return;
      }
      if (room.phase === "question"){
        const key = "r" + room.round;
        if (key !== lastRoundKey){ lastRoundKey = key; myPick = null; revealAttemptRound = -99; }
        if (myPick == null && room.answers && room.answers[room.round] && room.answers[room.round][me.id] != null) myPick = room.answers[room.round][me.id];
      }
      maybeAutoReveal();
      applyRoom();
    });
  }
  function updateTimerUI(){
    if (!room || room.phase !== "question" || !room.timerSecs) return;
    const remain = Math.max(0, room.timerSecs - Math.floor((Date.now() - room.qStartTs) / 1000));
    const bar = document.getElementById("timerbar"), txt = document.getElementById("timertext");
    if (bar){ bar.style.width = (remain / room.timerSecs * 100) + "%"; bar.style.background = remain <= 5 ? "var(--coral)" : "var(--aqua)"; }
    if (txt){ txt.textContent = remain + "s"; txt.style.color = remain <= 5 ? "var(--coral)" : "var(--lav)"; }
  }
  function maybeAutoReveal(){
    if (!db || !room || room.phase !== "question" || !currentCode || revealAttemptRound === room.round) return;
    const players = Object.keys(room.players || {}).length;
    const answered = Object.keys((room.answers && room.answers[room.round]) || {}).length;
    const timeUp = room.timerSecs > 0 && (Date.now() - room.qStartTs) >= room.timerSecs * 1000;
    if (players > 0 && (answered >= players || timeUp)){ revealAttemptRound = room.round; update(rref(), { phase: "reveal" }).catch(()=>{}); }
  }

  // ---------- actions ----------
  async function createRoom(){
    const name = (document.getElementById("nameInput").value || "").trim().slice(0,14);
    if (!name){ setMsg("Enter your name first."); return; }
    me.name = name; lsSet("geo_name", name);
    let code = genCode();
    try {
      for (let i = 0; i < 5; i++){ const s = await get(ref(db, "georooms/" + code)); if (!s.exists()) break; code = genCode(); }
      const r = { code, phase:"lobby", round:-1, totalRounds:settings.rounds, timerSecs:settings.timer, seq:null, qStartTs:0, answers:null, players:{ [me.id]:{ name } }, createdAt:Date.now() };
      await set(ref(db, "georooms/" + code), r);
      currentCode = code; lsSet("geo_code", code); room = r;
    } catch (e){ setMsg("Could not reach Firebase: " + ((e && e.message) || e)); return; }
    view = "room"; inQuestionKey = null; render(); listen(code);
  }
  async function joinRoom(){
    const name = (document.getElementById("nameInput").value || "").trim().slice(0,14);
    const code = (document.getElementById("codeInput").value || "").trim().toUpperCase();
    if (!name){ setMsg("Enter your name first."); return; }
    if (!code){ setMsg("Enter a room code."); return; }
    me.name = name; lsSet("geo_name", name);
    let snap;
    try { snap = await get(ref(db, "georooms/" + code)); }
    catch (e){ setMsg("Could not reach Firebase: " + ((e && e.message) || e)); return; }
    if (!snap.exists()){ setMsg('No game found with code "' + code + '".'); return; }
    try { await set(ref(db, "georooms/" + code + "/players/" + me.id), { name }); }
    catch (e){ setMsg("Join failed: " + ((e && e.message) || e)); return; }
    currentCode = code; lsSet("geo_code", code);
    const doc = snap.val();
    room = doc.players && doc.players[me.id] ? doc : { ...doc, players: { ...(doc.players||{}), [me.id]: { name } } };
    view = "room"; inQuestionKey = null; render(); listen(code);
  }
  function startGame(){ const total = room.totalRounds || 10; update(rref(), { phase:"question", round:0, seq:buildSeq(total), qStartTs:Date.now(), answers:null }).catch(()=>{}); }
  function nextRound(){ const nr = room.round + 1; if (nr >= room.totalRounds) update(rref(), { phase:"ended" }).catch(()=>{}); else update(rref(), { phase:"question", round:nr, qStartTs:Date.now() }).catch(()=>{}); }
  function playAgain(){ const total = room.totalRounds || 10; update(rref(), { phase:"question", round:0, seq:buildSeq(total), qStartTs:Date.now(), answers:null }).catch(()=>{}); }
  async function answer(i){
    if (!room || room.phase !== "question" || myPick != null) return;
    myPick = i; refreshQuestionDynamic();
    try { await set(ref(db, "georooms/" + currentCode + "/answers/" + room.round + "/" + me.id), i); } catch {}
  }
  function setRounds(v){ if (room && room.phase === "lobby") update(rref(), { totalRounds: v }).catch(()=>{}); }
  function setTimer(v){ if (room && room.phase === "lobby") update(rref(), { timerSecs: v }).catch(()=>{}); }
  function leave(){
    try { if (currentCode) remove(ref(db, "georooms/" + currentCode + "/players/" + me.id)); } catch {}
    if (unsub) { unsub(); unsub = null; }
    try { if (mapInstance) mapInstance.destroy(); } catch {}
    mapInstance = null; currentCode = null; room = null; myPick = null; lastRoundKey = null; inQuestionKey = null;
    lsDel("geo_code"); view = "home"; render();
  }

  app_el.addEventListener("click", ev => {
    const t = ev.target.closest("[data-action]"); if (!t) return;
    const a = t.getAttribute("data-action");
    if (a === "create") createRoom();
    else if (a === "join") joinRoom();
    else if (a === "start") startGame();
    else if (a === "answer") answer(parseInt(t.getAttribute("data-i"), 10));
    else if (a === "reveal") update(rref(), { phase: "reveal" }).catch(()=>{});
    else if (a === "next") nextRound();
    else if (a === "playagain") playAgain();
    else if (a === "leave") leave();
    else if (a === "rounds") setRounds(parseInt(t.getAttribute("data-v"), 10));
    else if (a === "timer") setTimer(parseInt(t.getAttribute("data-v"), 10));
  });

  (async function init(){
    render();
    if (CONFIG_OK && db){
      const saved = lsGet("geo_code");
      if (saved){
        try { const s = await get(ref(db, "georooms/" + saved)); if (s.exists()){ currentCode = saved; room = s.val(); view = "room"; listen(saved); } else lsDel("geo_code"); } catch {}
        applyRoom();
      }
      setInterval(() => { updateTimerUI(); maybeAutoReveal(); }, 1000);
    }
  })();
</script>
</body>
</html>
